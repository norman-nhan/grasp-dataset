[project]
name = "openarm-grasp-dataset"
version = "0.1.0"
description = "Offline geometry sampling and OpenArm gripper-only MuJoCo evaluation"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "scipy>=1.13",
    "trimesh>=4.4",
    "mujoco>=3.2",
    "pyyaml>=6",
    "rtree>=1.3",
    "networkx>=3.6.1",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
ycb = [
    "coacd>=1.0.7",
    "fast-simplification>=0.1.12",
]
laso = [
    "coacd>=1.0.14",
    "scikit-image>=0.26.0",
]
visualization = ["matplotlib>=3.9"]
[project.scripts]
openarm-dataset = "grasp_dataset.cli:main"
openarm-scene = "grasp_dataset.simple_scene:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["grasp_dataset"]
[tool.pytest.ini_options]
testpaths = ["tests"]
